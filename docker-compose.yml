services:
  postgres:
    profiles: ["pg"]
    restart: always
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  idigest-hub:
    restart: always
    # CI sets HUB_IMAGE to $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA; local default below.
    image: ${HUB_IMAGE:-idigest-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/hub.db}
      LOG_DIR: /data/logs
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
