services:
  postgres:
    profiles: ["pg"]
    restart: always
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - ./data/pg:/var/lib/postgresql/data

  idigest-hub:
    restart: always
    image: idigest-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "1001:1001"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/hub.db}
      LOG_DIR: /data/logs
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/data
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1"]
